<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>دراسات اجتماعية · الثالث الإعدادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#05080f;--bg-2:#0a1020;--bg-3:#0f1830;
  --surface:rgba(255,255,255,.04);--surface-2:rgba(255,255,255,.07);--surface-3:rgba(255,255,255,.1);
  --brd:rgba(255,255,255,.08);--brd-2:rgba(255,255,255,.15);--brd-hi:rgba(245,201,107,.45);
  --ink:#eef4fa;--ink-dim:#9bb1c5;--ink-mute:#6b8298;
  --gold:#f5c96b;--gold-2:#d99a2b;--gold-3:#8b6914;
  --emerald:#4ade80;--sky:#60a5fa;--rose:#fb7185;--violet:#a78bfa;--orange:#fb923c;--cyan:#22d3ee;
  --ok:#4ade80;--bad:#f87171;
  --g1:linear-gradient(135deg,#f5c96b,#fb923c);
  --g2:linear-gradient(135deg,#60a5fa,#a78bfa);
  --g3:linear-gradient(135deg,#4ade80,#22d3ee);
  --g4:linear-gradient(135deg,#fb7185,#f472b6);
  --g5:linear-gradient(135deg,#fb923c,#facc15);
  --g6:linear-gradient(135deg,#a78bfa,#60a5fa);
  --sh-1:0 4px 14px -4px rgba(0,0,0,.4);
  --sh-2:0 20px 50px -20px rgba(0,0,0,.8);
  --sh-gold:0 0 40px -10px rgba(245,201,107,.5);
  --ease:cubic-bezier(.2,.7,.3,1);
}
[data-theme="light"]{
  --bg:#f5f7fc;--bg-2:#eaeff9;--bg-3:#dde5f3;
  --surface:rgba(255,255,255,.9);--surface-2:rgba(255,255,255,.95);--surface-3:#fff;
  --brd:rgba(0,0,0,.08);--brd-2:rgba(0,0,0,.14);--brd-hi:rgba(184,134,47,.45);
  --ink:#0a1220;--ink-dim:#4a6076;--ink-mute:#7d92a8;
  --gold:#b8862f;--gold-2:#8b6914;--gold-3:#5c4409;
  --sh-1:0 4px 14px -4px rgba(15,23,42,.12);
  --sh-2:0 20px 50px -20px rgba(15,23,42,.2);
  --sh-gold:0 0 40px -12px rgba(184,134,47,.4);
}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  background:var(--bg);color:var(--ink);
  font:500 16px/1.85 'Tajawal',system-ui,sans-serif;
  overflow-x:hidden;min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 60% at 15% 0%,rgba(245,201,107,.12),transparent 50%),
    radial-gradient(ellipse 70% 50% at 90% 20%,rgba(96,165,250,.1),transparent 50%),
    radial-gradient(ellipse 90% 70% at 50% 100%,rgba(167,139,250,.1),transparent 50%);
  background-attachment:fixed;
}
h1,h2,h3,h4,button,input{font-family:'Cairo',sans-serif}
::selection{background:var(--gold);color:#05080f}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--brd-2);border-radius:9px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:var(--gold-3)}
button{background:none;border:none;color:inherit;cursor:pointer;font:inherit}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%;display:block}
[hidden]{display:none !important}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes gradMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes toastIn{from{transform:translateX(-120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(-120%);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,201,107,.6)}50%{box-shadow:0 0 0 12px rgba(245,201,107,0)}}

/* Scroll progress */
.sp{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;background:transparent}
.sp i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--orange),var(--rose),var(--violet),var(--sky));background-size:200% 100%;animation:gradMove 3s ease infinite;transition:width .12s linear;box-shadow:0 0 14px rgba(245,201,107,.8)}

/* Topbar */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 18px;
  background:rgba(5,8,15,.7);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--brd);
}
[data-theme="light"] .topbar{background:rgba(245,247,252,.82)}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:var(--g1);position:relative;overflow:hidden;
  box-shadow:0 8px 22px -8px rgba(245,201,107,.7);
}
.brand-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 3s infinite}
.brand-logo svg{width:22px;height:22px;position:relative;z-index:1;stroke:#05080f;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font:800 .95rem 'Cairo'}
.brand-text span{font:600 .7rem 'Tajawal';color:var(--ink-mute)}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:42px;height:42px;border-radius:12px;
  border:1px solid var(--brd);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;
  transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s;
}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{transform:scale(1.08) rotate(-6deg);background:var(--surface-2);border-color:var(--gold-3);color:var(--gold)}
.icon-btn:active{transform:scale(.92)}

/* Page */
.page{max-width:1000px;margin:0 auto;padding:0 18px 80px;position:relative;min-height:100vh}

/* Hero */
.hero{position:relative;padding:60px 0 30px;overflow:hidden;text-align:center}
.hero-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28}
.hero-blob.b1{top:-100px;right:-80px;width:460px;height:460px;background:radial-gradient(circle,#f5c96b,transparent 70%);animation:floatY 10s ease-in-out infinite}
.hero-blob.b2{bottom:-150px;left:-80px;width:420px;height:420px;background:radial-gradient(circle,#a78bfa,transparent 70%);animation:floatY 12s ease-in-out infinite reverse}
.hero-inner{position:relative;z-index:1;animation:fadeUp .8s var(--ease) both}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font:700 .78rem 'Cairo';color:var(--gold);
  background:rgba(245,201,107,.1);border:1px solid rgba(245,201,107,.32);
  padding:8px 18px;border-radius:999px;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.eyebrow::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(245,201,107,.2),transparent);animation:shimmer 3s infinite}
.eyebrow .live{width:7px;height:7px;border-radius:50%;background:var(--gold);position:relative;z-index:1;animation:glowPulse 2s infinite}
.eyebrow span{position:relative;z-index:1}

h1.big{
  font:900 clamp(2.2rem,10vw,5.5rem)/1.05 'Cairo';
  letter-spacing:-.035em;margin:0 0 22px;
  background:linear-gradient(120deg,var(--gold) 0%,var(--orange) 30%,var(--rose) 55%,var(--violet) 75%,var(--sky) 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradMove 9s ease infinite;
}
.hero-sub{color:var(--ink-dim);font-size:1rem;max-width:34em;margin:0 auto 30px;line-height:1.8}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto 36px}
.stat-box{
  background:var(--surface);border:1px solid var(--brd);border-radius:16px;
  padding:18px 10px;text-align:center;position:relative;overflow:hidden;
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.stat-box::before{content:'';position:absolute;top:0;inset-inline:0;height:3px;background:var(--g1);border-radius:3px 3px 0 0}
.stat-box:nth-child(2)::before{background:var(--g2)}
.stat-box:nth-child(3)::before{background:var(--g3)}
.stat-box:hover{transform:translateY(-5px);border-color:var(--brd-hi);box-shadow:var(--sh-gold)}
.stat-box b{display:block;font:900 clamp(1.6rem,5vw,2.2rem) 'Cairo';color:var(--gold);line-height:1;letter-spacing:-.02em}
.stat-box span{font:600 .72rem 'Tajawal';color:var(--ink-mute);margin-top:6px;display:block;letter-spacing:.3px}

.overall{
  background:var(--surface);border:1px solid var(--brd);border-radius:20px;
  padding:20px;max-width:520px;margin:0 auto;
  backdrop-filter:blur(20px);
}
.overall-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.overall-top b{font:800 .88rem 'Cairo'}
.overall-top span{font:900 1.25rem 'Cairo';color:var(--gold);letter-spacing:-.01em}
.overall-track{height:10px;background:var(--surface-3);border-radius:10px;overflow:hidden}
.overall-track i{display:block;height:100%;background:var(--g1);border-radius:10px;transition:width 1.4s var(--ease);box-shadow:0 0 20px rgba(245,201,107,.5);position:relative;overflow:hidden}
.overall-track i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 2.2s infinite}

/* Section title */
.sec-title{display:flex;align-items:baseline;gap:12px;margin:40px 0 22px;padding:0 4px}
.sec-title h2{font:800 1.5rem 'Cairo';letter-spacing:-.02em;position:relative;padding-bottom:8px}
.sec-title h2::after{content:'';position:absolute;bottom:0;inset-inline-start:0;width:44px;height:3px;background:var(--g1);border-radius:3px}
.sec-title span{font:500 .82rem 'Tajawal';color:var(--ink-mute)}

/* Cards grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

.card{
  position:relative;display:flex;flex-direction:column;
  text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--brd);border-radius:22px;
  padding:24px 22px 22px;overflow:hidden;
  backdrop-filter:blur(20px) saturate(160%);
  transition:transform .4s var(--ease),box-shadow .4s,border-color .3s;
  cursor:pointer;min-height:210px;
}
.card::before{
  content:'';position:absolute;inset:0;opacity:0;
  background:var(--card-grad,var(--g1));
  transition:opacity .5s;
}
.card:hover{transform:translateY(-8px);border-color:var(--brd-hi);box-shadow:var(--sh-2),var(--sh-gold)}
.card:hover::before{opacity:.09}
.card:active{transform:translateY(-3px) scale(.99)}

.card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:1}
.num-badge{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;
  font:900 1.05rem 'Cairo';color:#05080f;
  background:var(--card-grad,var(--g1));
  box-shadow:0 8px 22px -6px rgba(245,201,107,.5);
  transition:transform .45s var(--ease);
}
.card:hover .num-badge{transform:rotate(-10deg) scale(1.12)}
.card-tag{
  font:700 .68rem 'Cairo';color:var(--gold);
  background:rgba(245,201,107,.12);border:1px solid rgba(245,201,107,.28);
  padding:4px 11px;border-radius:999px;
}
.card h3{
  font:800 1.05rem/1.45 'Cairo';margin:0 0 8px;letter-spacing:-.01em;
  position:relative;z-index:1;display:flex;align-items:center;gap:8px;
}
.card h3 .ico{font-size:1.3rem;flex-shrink:0}
.card p{font:500 .82rem/1.6 'Tajawal';color:var(--ink-dim);margin:0 0 auto;flex:1;position:relative;z-index:1}
.card-foot{
  display:flex;justify-content:space-between;align-items:center;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--brd);position:relative;z-index:1;
}
.card-foot .pm{display:flex;align-items:center;gap:8px;flex:1}
.card-foot .pm-t{flex:1;height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.card-foot .pm-t i{display:block;height:100%;background:var(--card-grad,var(--g1));border-radius:6px;transition:width .9s var(--ease)}
.card-foot .pm b{font:800 .72rem 'Cairo';color:var(--gold);flex-shrink:0}
.card-arrow{font-size:1.2rem;color:var(--gold);transition:transform .3s var(--ease)}
.card:hover .card-arrow{transform:translateX(-8px)}

.cv1{--card-grad:var(--g1)}.cv2{--card-grad:var(--g2)}.cv3{--card-grad:var(--g3)}
.cv4{--card-grad:var(--g4)}.cv5{--card-grad:var(--g5)}.cv6{--card-grad:var(--g6)}

/* Reader */
.reader{animation:fadeIn .4s both}
.back-link{
  display:inline-flex;align-items:center;gap:8px;margin-top:20px;
  font:800 .82rem 'Cairo';color:var(--gold);
  padding:10px 16px;border-radius:12px;
  background:var(--surface);border:1px solid var(--brd);
  transition:transform .25s var(--ease),background .25s,border-color .25s;
}
.back-link:hover{transform:translateX(-4px);border-color:var(--gold-3);background:var(--surface-2)}
.back-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

.lesson-hero{text-align:center;padding:32px 0 18px;animation:fadeUp .5s var(--ease) both}
.lesson-hero .badge{
  display:inline-block;font:800 .7rem 'Cairo';color:var(--gold);
  background:rgba(245,201,107,.12);border:1px solid rgba(245,201,107,.32);
  padding:6px 15px;border-radius:999px;margin-bottom:16px;
}
.lesson-hero h1{font:900 clamp(1.5rem,5vw,2.3rem)/1.35 'Cairo';letter-spacing:-.025em;margin:0 0 10px}
.lesson-hero .sub{color:var(--ink-dim);font-size:.86rem}
.lesson-icon{
  width:78px;height:78px;margin:0 auto 18px;border-radius:22px;
  background:var(--g1);display:grid;place-items:center;font-size:2.2rem;
  box-shadow:0 18px 40px -14px rgba(245,201,107,.7);
  animation:floatY 4.5s ease-in-out infinite;
}

/* Modes */
.modes{
  position:sticky;top:64px;z-index:40;
  display:flex;gap:6px;padding:8px;border-radius:18px;
  background:rgba(5,8,15,.85);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--brd);margin:16px 0 22px;
  box-shadow:var(--sh-2);
}
[data-theme="light"] .modes{background:rgba(245,247,252,.9)}
.modes button{
  flex:1;padding:14px 12px;border-radius:12px;
  background:transparent;color:var(--ink-dim);
  font:800 .82rem 'Cairo';position:relative;overflow:hidden;
  transition:color .3s,transform .3s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  z-index:1;
}
.modes button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;transition:transform .3s}
.modes button::before{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:var(--g1);opacity:0;transition:opacity .3s;z-index:-1;
}
.modes button.on{color:#05080f;transform:scale(1.03)}
.modes button.on::before{opacity:1}
.modes button.on svg{transform:scale(1.15) rotate(-6deg)}
.modes button:not(.on):hover{color:var(--ink);background:var(--surface-2)}

#app{padding-bottom:50px}

/* Sections */
.sec{
  position:relative;background:var(--surface);border:1px solid var(--brd);
  border-radius:18px;margin-bottom:14px;overflow:hidden;
  backdrop-filter:blur(20px);
  transition:border-color .3s,box-shadow .3s;
}
.sec:hover{border-color:rgba(245,201,107,.28)}
.sec-head{
  display:flex;align-items:center;gap:14px;
  padding:18px 20px;cursor:pointer;user-select:none;
  transition:background .25s;
}
.sec-head:hover{background:var(--surface-2)}
.sec-head .num{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:var(--g1);color:#05080f;
  display:grid;place-items:center;font:900 .92rem 'Cairo';
  box-shadow:0 6px 16px -4px rgba(245,201,107,.5);
  transition:transform .35s var(--ease);
}
.sec:nth-child(2n) .sec-head .num{background:var(--g2)}
.sec:nth-child(3n) .sec-head .num{background:var(--g3)}
.sec:nth-child(4n) .sec-head .num{background:var(--g4)}
.sec:nth-child(5n) .sec-head .num{background:var(--g5)}
.sec-head h2{font:800 .98rem/1.45 'Cairo';margin:0;flex:1;letter-spacing:-.01em}
.sec-head .chev{
  width:26px;height:26px;flex-shrink:0;border-radius:8px;
  background:var(--surface-3);
  display:grid;place-items:center;color:var(--gold);
  transition:transform .35s var(--ease);
}
.sec-head .chev svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sec.closed .sec-head .chev{transform:rotate(-90deg)}
.sec:not(.closed):hover .sec-head .num{transform:scale(1.08) rotate(-8deg)}
.sec-body{max-height:0;overflow:hidden;transition:max-height .55s cubic-bezier(.4,0,.2,1),opacity .35s;opacity:0}
.sec:not(.closed) .sec-body{max-height:9000px;opacity:1}
.sec-inner{padding:0 20px 20px}

/* Content blocks */
.blk,.callout,.conclusion,.obs-box{
  position:relative;border-radius:13px;padding:16px 18px;margin:10px 0;
  font-size:.92rem;line-height:1.8;
  background:var(--surface-2);border:1px solid var(--brd);
  border-inline-start:4px solid var(--gold);
  transition:transform .25s var(--ease),box-shadow .25s;
}
.blk:hover,.callout:hover,.conclusion:hover,.obs-box:hover{transform:translateX(-3px);box-shadow:var(--sh-1)}
.callout{border-inline-start-color:var(--rose)}
.callout b,.obs-box b{color:var(--rose)}
.obs-box{border-inline-start-color:var(--violet)}
.obs-box b{color:var(--violet)}
.conclusion{border-inline-start-color:var(--emerald);background:linear-gradient(135deg,rgba(74,222,128,.08),var(--surface-2))}
.conclusion b{color:var(--emerald)}

.comp{
  background:var(--surface-2);border-radius:13px;padding:16px 18px;margin-bottom:10px;
  border:1px solid var(--brd);position:relative;overflow:hidden;
  transition:transform .25s var(--ease),box-shadow .25s,background .25s;
}
.comp::before{content:'';position:absolute;top:0;inset-inline-end:0;width:5px;height:100%;background:var(--accent,var(--gold));transition:width .3s}
.comp:hover{transform:translateX(-4px);box-shadow:var(--sh-1);background:var(--surface-3)}
.comp:hover::before{width:8px}
.comp-t{display:flex;align-items:center;gap:9px;font:800 .94rem 'Cairo';color:var(--accent,var(--gold));margin-bottom:8px;letter-spacing:-.01em}
.comp-t .dot{width:8px;height:8px;border-radius:50%;background:var(--accent,var(--gold));box-shadow:0 0 10px var(--accent,var(--gold));animation:pulse 2.4s infinite}
.comp p{font-size:.89rem;margin:0 0 6px;color:var(--ink-dim)}
.comp p:last-child{margin-bottom:0}
.comp .fact{font-size:.83rem;color:var(--ink-dim);padding-top:8px;margin-top:8px;border-top:1px dashed var(--brd)}
.comp ul,.comp ol{margin:6px 0;padding-inline-start:20px}
.comp li{font-size:.87rem;color:var(--ink-dim);margin-bottom:4px}
.acc-green{--accent:var(--emerald)}.acc-sky{--accent:var(--sky)}.acc-rose{--accent:var(--rose)}
.acc-violet{--accent:var(--violet)}.acc-orange{--accent:var(--orange)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.split .col{
  background:var(--surface-2);border:1px solid var(--brd);border-radius:13px;
  padding:16px;position:relative;overflow:hidden;
  transition:transform .25s var(--ease),border-color .25s;
}
.split .col::after{content:'';position:absolute;top:0;inset-inline:0;height:2px;background:var(--col-accent,var(--gold));box-shadow:0 0 12px var(--col-accent,var(--gold))}
.split .col:hover{transform:translateY(-3px);border-color:color-mix(in oklab,var(--col-accent,var(--gold)) 40%,var(--brd))}
.split .col h4{font:800 .88rem 'Cairo';color:var(--col-accent,var(--gold));margin:0 0 8px;display:flex;align-items:center;gap:6px}
.split .col ul{margin:0;padding-inline-start:18px;font-size:.84rem;color:var(--ink-dim)}
.split .col ul li{margin-bottom:4px}
.split .col p{font-size:.85rem;color:var(--ink-dim);margin:0;line-height:1.7}
.col.safe{--col-accent:var(--emerald)}
.col.danger{--col-accent:var(--rose)}
.col.info{--col-accent:var(--sky)}
.col.warm{--col-accent:var(--orange)}
.col.vio{--col-accent:var(--violet)}

.steps{list-style:none;padding:0;margin:0}
.steps li{
  display:flex;gap:13px;background:var(--surface-2);border-radius:12px;
  padding:13px 16px;margin-bottom:9px;font-size:.88rem;
  border:1px solid var(--brd);
  transition:transform .25s var(--ease),background .25s,border-color .25s;
}
.steps li:hover{transform:translateX(-4px);border-color:var(--gold-3);background:var(--surface-3)}
.steps .n{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;
  background:var(--g1);color:#05080f;
  display:grid;place-items:center;font:900 .78rem 'Cairo';
}
.steps .n-content{flex:1;line-height:1.7}
.steps .n-content b{color:var(--gold)}

/* Flashcards */
.cnt-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;font:700 .82rem 'Cairo';
  padding:12px 16px;background:var(--surface);border:1px solid var(--brd);border-radius:13px;
}
.cnt-bar b{color:var(--gold);display:flex;gap:10px}
.fc{perspective:1600px;height:320px;margin-bottom:18px;cursor:pointer;user-select:none}
.fc-in{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--brd);border-radius:24px;
  padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  overflow:auto;box-shadow:var(--sh-2);
}
.face::before{content:'';position:absolute;top:0;inset-inline:0;height:4px;background:var(--g1);border-radius:24px 24px 0 0}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(245,201,107,.12),var(--surface))}
.face.back::before{background:var(--g2)}
.face small{font:800 .7rem 'Cairo';color:var(--gold);letter-spacing:.6px;margin-bottom:14px;text-transform:uppercase}
.face .t{font-size:1rem;font-weight:700;line-height:1.75;max-width:92%}
.face .hint{margin-top:20px;font-size:.75rem;color:var(--ink-mute);animation:floatY 3.5s ease-in-out infinite}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Buttons */
.btn{
  position:relative;overflow:hidden;
  font:800 .84rem 'Cairo';padding:13px 22px;border-radius:12px;
  border:1px solid var(--brd);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s,background .25s;
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh-1);border-color:var(--gold-3);background:var(--surface-2)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.pri{background:var(--g1);color:#05080f;border-color:transparent;box-shadow:0 8px 22px -8px rgba(245,201,107,.7)}
.btn.pri:hover{box-shadow:0 12px 32px -10px rgba(245,201,107,.9)}

/* Quiz */
.quiz-shell{
  background:var(--surface);border:1px solid var(--brd);border-radius:22px;
  padding:24px;backdrop-filter:blur(24px);box-shadow:var(--sh-2);
  position:relative;overflow:hidden;
}
.quiz-shell::before{
  content:'';position:absolute;top:0;inset-inline:0;height:4px;
  background:linear-gradient(90deg,var(--gold),var(--orange),var(--rose),var(--violet));
  background-size:200% 100%;animation:gradMove 4s ease infinite;
}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.quiz-head .meta{font:800 .82rem 'Cairo';color:var(--ink-dim)}
.quiz-head .meta b{color:var(--gold);font-weight:900}
.streak{
  display:flex;align-items:center;gap:6px;
  font:800 .82rem 'Cairo';color:var(--orange);
  background:rgba(251,146,60,.12);padding:6px 13px;border-radius:999px;
  border:1px solid rgba(251,146,60,.32);
}
.streak.fire{animation:pop .5s}
.q-progress{height:8px;background:var(--surface-3);border-radius:8px;margin-bottom:22px;overflow:hidden}
.q-progress i{display:block;height:100%;background:var(--g1);border-radius:8px;transition:width .6s var(--ease);box-shadow:0 0 14px rgba(245,201,107,.6)}
.qt{font:700 1rem/1.7 'Cairo';margin-bottom:20px;letter-spacing:-.01em}
.opt{
  display:block;width:100%;text-align:right;margin-bottom:10px;padding:16px 20px;
  font:600 .9rem/1.65 'Tajawal',sans-serif;
  border-radius:13px;border:1.5px solid var(--brd);background:var(--surface-2);
  color:var(--ink);cursor:pointer;
  transition:all .3s var(--ease);position:relative;overflow:hidden;
}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(-5px);background:var(--surface-3)}
.opt.ok{border-color:var(--ok);background:linear-gradient(135deg,rgba(74,222,128,.2),var(--surface-2));animation:pop .5s}
.opt.ok::after{content:'✓';position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--ok);font:900 20px 'Cairo'}
.opt.bad{border-color:var(--bad);background:linear-gradient(135deg,rgba(248,113,113,.2),var(--surface-2));animation:shake .5s}
.opt.bad::after{content:'✕';position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--bad);font:900 20px 'Cairo'}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-size:1rem;padding:24px 14px}
.tf .opt::after{display:none}
.fb{margin-top:16px;padding:16px 18px;border-radius:13px;background:var(--surface-2);font-size:.88rem;line-height:1.75;border-inline-start:4px solid var(--gold);animation:fadeUp .4s var(--ease) both}

/* Score */
.score-wrap{text-align:center;padding:34px 20px;position:relative}
.ring{
  width:180px;height:180px;margin:0 auto 24px;border-radius:50%;position:relative;
  background:conic-gradient(from -90deg,var(--gold) calc(var(--pct) * 1%),var(--surface-3) 0);
  display:grid;place-items:center;
  transition:background 1.5s var(--ease);
  box-shadow:0 0 60px -10px rgba(245,201,107,.55);
}
.ring::before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--bg-2);z-index:1}
.ring::after{content:'';position:absolute;inset:-18px;border-radius:50%;border:2px dashed rgba(245,201,107,.28);animation:orbit 26s linear infinite}
.ring b{position:relative;font:900 2.6rem 'Cairo';color:var(--gold);line-height:1;z-index:2;letter-spacing:-.02em}
.ring b small{display:block;font:600 .72rem 'Tajawal';color:var(--ink-mute);margin-top:6px}
.result-msg{font:800 1.3rem 'Cairo';margin:0 0 8px;letter-spacing:-.02em}
.result-sub{color:var(--ink-dim);font-size:.85rem;margin-bottom:22px;line-height:1.7}
.result-stats{display:flex;justify-content:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.result-stats .rs{background:var(--surface-2);border:1px solid var(--brd);padding:12px 18px;border-radius:12px;min-width:90px}
.result-stats .rs b{display:block;font:900 1.5rem 'Cairo';color:var(--gold);letter-spacing:-.02em}
.result-stats .rs span{font:600 .72rem 'Tajawal';color:var(--ink-mute)}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;width:10px;height:14px;top:-20px;animation:confetti 3s linear forwards;border-radius:2px}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;inset-inline-start:22px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:320px}
.toast{
  background:linear-gradient(135deg,var(--g1));color:#05080f;
  padding:14px 18px;border-radius:14px;
  display:flex;align-items:center;gap:11px;
  box-shadow:var(--sh-2),0 0 30px -8px rgba(245,201,107,.7);
  animation:toastIn .5s var(--ease) both;
  pointer-events:auto;font:800 .84rem 'Cairo';
}
.toast.out{animation:toastOut .4s var(--ease) forwards}
.toast .emoji{font-size:1.5rem;flex-shrink:0}

/* Empty */
.empty{text-align:center;color:var(--ink-dim);padding:50px 20px;font-size:.9rem}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>

<script>
const SOC_SUM={
1:`<div class="callout">💡 <b>الفكرة الرئيسية:</b> أدى اكتشاف قارات العالم الجديد إلى إعادة رسم خريطة العالم، وتعدّ دراسة الموقع الجغرافي ومظاهر سطح هذه القارات من العوامل الأساسية لفهم خصائصها الطبيعية والاقتصادية والحضارية.</div>
<section><div class="sec-head"><div class="num">🌍</div><h2>ماذا تعرف عن قارات العالم الجديد؟</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner"><div class="blk">قارات العالم الجديد هى: قارة أمريكا الشمالية، وقارة أمريكا الجنوبية، والقارة القطبية الجنوبية (أنتاركتيكا)، وقارة أستراليا. تعلمنا فيما سبق أن الموقع (فلكى - جغرافى) وتنوع مظاهر السطح من العوامل الأساسية التى أثرت فى خصائص القارات المختلفة (نظم بيئية - أنشطة سكانية...).</div></div></div></section>
<section><div class="sec-head"><div class="num">📏</div><h2>المساحة والترتيب بين قارات العالم</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner">
<div class="comp acc-green"><div class="comp-t"><span class="dot"></span>أمريكا الشمالية</div><p>ثالث أكبر قارة (بعد آسيا وإفريقيا).</p></div>
<div class="comp acc-sky"><div class="comp-t"><span class="dot"></span>أمريكا الجنوبية</div><p>رابع أكبر قارة.</p></div>
<div class="comp acc-orange"><div class="comp-t"><span class="dot"></span>القارة القطبية الجنوبية</div><p>خامس أكبر قارة.</p></div>
<div class="comp acc-violet"><div class="comp-t"><span class="dot"></span>أستراليا</div><p>سابع وأصغر قارة.</p></div>
<div class="blk">* هذا العام سيتم دراسة الأمريكتين وأستراليا من حيث السكان لأنها قارات مأهولة، ولن يتم دراسة القارة القطبية الجنوبية من حيث السكان لأنها متجمدة وغير مأهولة بالسكان.</div>
</div></div></section>
<section><div class="sec-head"><div class="num">🧭</div><h2>الموقع الفلكى والجغرافى لكل قارة</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner">
<div class="comp acc-green"><div class="comp-t"><span class="dot"></span>أمريكا الشمالية</div><p><b>الموقع الفلكى:</b> بين دائرتى عرض ٧°٣٠′ و٨٣° شمالًا، وخطى طول ١٠° و١٦٨° غربًا.</p><div class="fact"><b>يحدها:</b> شمالًا المحيط القطبى الشمالى · شرقًا الأطلنطى · جنوبًا وجنوب شرقًا البحر الكاريبى وأمريكا الجنوبية · غربًا الهادى.</div></div>
<div class="comp acc-sky"><div class="comp-t"><span class="dot"></span>أمريكا الجنوبية</div><p><b>الموقع الفلكى:</b> بين دائرتى عرض ١٢° شمالًا و٥٦° جنوبًا، وخطى طول ٣٥° و٨١° غربًا.</p><div class="fact"><b>يحدها:</b> شمالًا البحر الكاريبى وأمريكا الشمالية · شرقًا الأطلنطى · غربًا الهادى.</div></div>
<div class="comp acc-orange"><div class="comp-t"><span class="dot"></span>القارة القطبية الجنوبية</div><p>تقع فى أقصى جنوب الكرة الأرضية حول القطب الجنوبى مباشرة.</p><div class="fact"><b>يحدها:</b> يحيط بها المحيط القطبى الجنوبى من كل الجهات.</div></div>

<div class="conclusion">📌 <b>دلل:</b> تظهر قارة أستراليا على شكل جزيرة كبيرة؛ حيث تحيط بها المياه من جميع الجهات.</div>
<div class="conclusion">📌 <b>دلل:</b> هناك تشابه بين موقعى قارتى أمريكا الشمالية والجنوبية فى الحدود الشرقية والغربية.</div>

<section><div class="sec-head"><div class="num">⭐</div><h2>أهمية الموقع الفلكى والجغرافى</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner">

<div class="comp acc-orange"><div class="comp-t"><span class="dot"></span>💰 الأهمية الاقتصادية</div><p>بسبب تنوع النظم البيئية، وامتلاك كميات كبيرة من مصادر الطاقة الأحفورية ومساحات كبيرة من الأراضى الزراعية. وتمتلك احتياطيات كبيرة من المعادن مثل اليورانيوم والحديد فى أستراليا.</p></div>
<div class="comp acc-violet"><div class="comp-t"><span class="dot"></span>🏺 الأهمية الحضارية</div><p>تُعد مركزًا لالتقاء الثقافات الأوروبية والإفريقية والآسيوية نتيجة كثرة الهجرات إليها. وظهرت بها حضارات قديمة مثل المايا والإنكا.</p></div>
</div></div></section>
<section><div class="sec-head"><div class="num">🏔️</div><h2>أهم مظاهر سطح قارات العالم الجديد</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner">

<section><div class="sec-head"><div class="num">🗺️</div><h2>السياسة الخارجية</h2><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="sec-body"><div class="sec-inner">

]],

]],

<script>
/* =============== APP LOGIC =============== */
const $=s=>document.getElementById(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MN={sum:'الملخص',card:'بطاقات',quiz:'اختبار'};
const MNSVG={
sum:'<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
card:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>',
quiz:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'
};
let curLesson=1, mode='sum', isDark=true, streak=0;

/* ---------- Theme ---------- */
function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem('theme')}catch(e){}
  isDark = saved!=='light';
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  $('#themeBtn').textContent=isDark?'🌙':'☀️';
}
$('#themeBtn').onclick=()=>{
  isDark=!isDark;
  document.documentElement.setAttribute('data-theme',isDark?'dark':'light');
  $('#themeBtn').textContent=isDark?'🌙':'☀️';
  try{localStorage.setItem('theme',isDark?'dark':'light')}catch(e){}
  toast(isDark?'🌙':'☀️', isDark?'الوضع الداكن':'الوضع الفاتح');
};
initTheme();

/* ---------- Best / Progress ---------- */
function best(){try{return JSON.parse(localStorage.getItem('zbest')||'{}')}catch(e){return{}}}
function saveBest(k,v){try{const b=best();b[k]=Math.max(b[k]||0,v);localStorage.setItem('zbest',JSON.stringify(b))}catch(e){}}
function getProg(id){return best()['soc-'+id]||0}
function updateOverall(){
  const scores=SOC_LESSONS.map(l=>getProg(l.id));
  const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  $('#overallPct').textContent=avg+'%';
  $('#overallBar').style.width=avg+'%';
}

/* ---------- Render home ---------- */
function renderHome(){
  $('#lessonsGrid').innerHTML=SOC_LESSONS.map((l,i)=>{
    const prog=getProg(l.id);
    return `<a class="card ${l.cv}" href="#lesson-${l.id}">
      <div class="card-top">
        <div class="num-badge">${i+1}</div>
        <span class="card-tag">${l.w}</span>
      </div>
      <h3><span class="ico">${l.icon}</span>${l.t}</h3>
      <p>${l.u}</p>
      <div class="card-foot">
        <div class="pm">
          <div class="pm-t"><i style="width:${prog}%"></i></div>
          <b>${prog}%</b>
        </div>
        <span class="card-arrow">←</span>
      </div>
    </a>`;
  }).join('');
  updateOverall();
}

/* ---------- Parse questions ---------- */
function items(p){
  if(!SOC_P[p])return[];
  return SOC_P[p].flatMap(([t,qs])=>qs.map(([q,a])=>{
    const o={t,q,a,type:'open'};
    if(/^\((✓|✗)\)/.test(a)){o.type='tf';o.ok=a[1];o.exp=a.replace(/^\((✓|✗)\)\s*/,'')}
    else if(/\(أ\)/.test(q)&&/\(ب\)/.test(q)&&/^\([أبجد]\)/.test(a)){
      const i=q.indexOf('(أ)');o.stem=q.slice(0,i).trim();o.opts=[];
      const re=/\(([أبجد])\)\s*([\s\S]*?)(?=\s*\([أبجد]\)\s|$)/g;let m,rest=q.slice(i);
      while((m=re.exec(rest)))o.opts.push([m[1],m[2].trim()]);
      if(o.opts.length>=2){o.type='mcq';o.ok=a.match(/^\(([أبجد])\)/)[1]}
    }
    return o;
  }));
}

/* ---------- Head tabs ---------- */
function head(){
  $('#modes').innerHTML=Object.keys(MN).map(m=>`<button class="${m==mode?'on':''}" data-m="${m}">${MNSVG[m]}<span>${MN[m]}</span></button>`).join('');
  document.querySelectorAll('#modes button').forEach(x=>x.onclick=()=>{mode=x.dataset.m;go()});
}
function go(){head();scrollTo({top:0,behavior:'smooth'});({sum:renderSum,card:renderCards,quiz:renderQuiz})[mode]()}

/* ---------- Open lesson ---------- */
function openLesson(id){
  curLesson=id;mode='sum';streak=0;
  const l=SOC_LESSONS.find(x=>x.id===id);
  $('#lessonTitle').textContent=l.t;
  $('#lessonSub').textContent=l.u;
  $('#lessonBadge').textContent=l.w;
  $('#lessonIcon').textContent=l.icon;
  $('#home').hidden=true;$('#reader').hidden=false;
  go();
}
function showHome(){
  $('#home').hidden=false;$('#reader').hidden=true;
  scrollTo({top:0,behavior:'smooth'});
  renderHome();
}

/* ---------- Summary ---------- */
function renderSum(){
  const content=SOC_SUM[curLesson]||'<p class="empty">لا يوجد محتوى.</p>';
  $('#app').innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn" id="tg">📂 فتح / طي الكل</button></div>'+content;
  document.querySelectorAll('#app section').forEach(s=>{
    s.classList.add('sec');
    const h=s.querySelector('.sec-head');
    if(!h)return;
    h.onclick=()=>s.classList.toggle('closed');
  });
  let closed=false;
  $('#tg').onclick=()=>{closed=!closed;document.querySelectorAll('#app section').forEach(s=>s.classList.toggle('closed',closed))};
}

/* ---------- Flashcards ---------- */
function renderCards(){
  let deck=shuffle(items(curLesson).filter(x=>x.type=='open')),i=0,know=0,again=0;
  if(!deck.length){$('#app').innerHTML='<p class="empty">لا توجد بطاقات.</p>';return}
  const draw=()=>{
    if(i>=deck.length){
      const pct=Math.round(know/deck.length*100);
      $('#app').innerHTML=`<div class="quiz-shell score-wrap">
        <div class="ring" style="--pct:${pct}"><b>${know}<small>من ${deck.length}</small></b></div>
        <p class="result-msg">${pct===100?'🏆 أتقنت كل البطاقات!':pct>=60?'👍 ممتاز، واصل':pct>=30?'📈 جيد، راجع الباقي':'📖 جرب مرة تانية'}</p>
        <p class="result-sub">راجعت ${again} بطاقة</p>
        <div class="row"><button class="btn pri" id="rp">🔁 أعد الكل</button>${again?'<button class="btn" id="ra">📌 راجع ما لم أعرفه</button>':''}</div>
      </div>`;
      $('#rp').onclick=()=>{deck=shuffle(deck);i=know=again=0;draw()};
      if($('#ra'))$('#ra').onclick=()=>{deck=shuffle(deck.filter(d=>d.miss));deck.forEach(d=>d.miss=0);i=know=again=0;draw()};
      return;
    }
    const c=deck[i];
    $('#app').innerHTML=`
      <div class="cnt-bar"><span>البطاقة ${i+1} من ${deck.length}</span><b>✅ ${know} · 🔁 ${again}</b></div>
      <div class="fc" id="fc"><div class="fc-in">
        <div class="face"><small>${c.t}</small><div class="t">${c.q}</div><div class="hint">👆 اضغط لقلب البطاقة</div></div>
        <div class="face back"><small>الإجابة</small><div class="t">${c.a}</div></div>
      </div></div>
      <div class="row"><button class="btn" id="no">🔁 راجعها</button><button class="btn pri" id="yes">✓ عرفتها</button></div>`;
    $('#fc').onclick=()=>$('#fc').classList.toggle('flip');
    $('#yes').onclick=()=>{know++;i++;draw()};
    $('#no').onclick=()=>{c.miss=1;again++;i++;draw()};
  };draw();
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  let pool=shuffle(items(curLesson).filter(x=>x.type!='open')),i=0,score=0,done=false;
  streak=0;
  if(!pool.length){$('#app').innerHTML='<p class="empty">لا توجد أسئلة.</p>';return}
  const key='soc-'+curLesson;
  const draw=()=>{
    if(i>=pool.length){
      const pct=Math.round(score/pool.length*100);
      saveBest(key,pct);
      const wrong=pool.filter(x=>x.w);
      let emoji='📖',msg='كرر بعد المراجعة';
      if(pct>=85){emoji='🏆';msg='ممتاز! إتقان كامل';fireConfetti();toast('🎉','نتيجة رائعة!')}
      else if(pct>=60){emoji='🎯';msg='جيد جدًا، راجع الأخطاء';toast('👍','أداء جيد')}
      else if(pct>=40){emoji='💪';msg='متوسط، واصل'}
      $('#app').innerHTML=`<div class="quiz-shell score-wrap">
        <div class="ring" style="--pct:${pct}"><b>${pct}%<small>${score} من ${pool.length}</small></b></div>
        <p class="result-msg">${emoji} ${msg}</p>
        <p class="result-sub">إجاباتك الصحيحة ${score} · الخاطئة ${pool.length-score}</p>
        <div class="result-stats">
          <div class="rs"><b>${score}</b><span>صحيحة</span></div>
          <div class="rs"><b>${pool.length-score}</b><span>خاطئة</span></div>
          <div class="rs"><b>${pct}%</b><span>النسبة</span></div>
        </div>
        <div class="row"><button class="btn pri" id="rs">🔁 اختبار جديد</button>${wrong.length?'<button class="btn" id="rw">📌 أعد الأسئلة الخاطئة ('+wrong.length+')</button>':''}</div>
      </div>`;
      $('#rs').onclick=renderQuiz;
      if($('#rw'))$('#rw').onclick=()=>{pool=shuffle(wrong);pool.forEach(x=>x.w=0);i=score=0;streak=0;draw()};
      return;
    }
    const q=pool[i];done=false;
    const body=q.type=='tf'
      ?`<div class="qt">${q.q}</div><div class="tf"><button class="opt" data-v="✓">✓ صحيحة</button><button class="opt" data-v="✗">✗ خاطئة</button></div>`
      :`<div class="qt">${q.stem}</div>`+q.opts.map(o=>`<button class="opt" data-v="${o[0]}">(${o[0]}) ${o[1]}</button>`).join('');
    $('#app').innerHTML=`<div class="quiz-shell">
      <div class="quiz-head">
        <span class="meta">سؤال <b>${i+1}</b> من ${pool.length} · الدرجة <b>${score}</b></span>
        <span class="streak" id="streak">🔥 ${streak}</span>
      </div>
      <div class="q-progress"><i style="width:${i/pool.length*100}%"></i></div>
      ${body}<div id="fb"></div>
    </div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;
      const ok=b.dataset.v==q.ok;
      document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v==q.ok)x.classList.add('ok')});
      if(ok){score++;streak++;const s=$('#streak');s.textContent='🔥 '+streak;s.classList.add('fire');setTimeout(()=>s.classList.remove('fire'),600);}
      else{b.classList.add('bad');q.w=1;streak=0;$('#streak').textContent='🔥 0';}
      $('#fb').innerHTML=`<div class="fb"><b>${ok?'✅ صحيحة':'❌ خاطئة'}</b>${q.type=='tf'&&q.exp?' — '+q.exp:(!ok&&q.type=='mcq'?' — الصحيحة: '+q.a:'')}</div>
        <div class="row" style="margin-top:14px"><button class="btn pri" id="nx">${i+1<pool.length?'التالي ←':'النتيجة'}</button></div>`;
      $('#nx').onclick=()=>{i++;draw()};
    });
  };draw();
}

/* ---------- Confetti ---------- */
function fireConfetti(){
  const colors=['#f5c96b','#fb923c','#60a5fa','#4ade80','#fb7185','#a78bfa','#22d3ee'];
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<70;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=(Math.random()*.5)+'s';
    c.style.animationDuration=(2.5+Math.random()*1.5)+'s';
    c.style.borderRadius=Math.random()>.5?'2px':'50%';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),4200);
}

/* ---------- Toast ---------- */
function toast(emoji,msg){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="emoji">${emoji}</span><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},2500);
}

/* ---------- Scroll progress + Ring ---------- */
const spEl=$('sp').firstElementChild;
addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  const pct=h>0?(scrollY/h)*100:0;
  spEl.style.width=Math.min(pct,100)+'%';
},{passive:true});

/* ---------- Router ---------- */
function route(){
  const m=location.hash.match(/^#lesson-(\d+)$/);
  if(m)openLesson(+m[1]);else showHome();
}
addEventListener('hashchange',route);
$('#backBtn').onclick=e=>{e.preventDefault();location.hash=''};

/* ---------- Init ---------- */
renderHome();
route();
</script>
